<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<title>Courses</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>

<body>

<div class="container mt-5">

<h1 class="mb-4">
    Courses Page
</h1>

<a href="/" class="btn btn-secondary mb-3">
    Back Home
</a>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>
            <th>Course Name</th>
            <th>Credits</th>
            <th>Teacher</th>
            <th>Actions</th>
        </tr>

    </thead>

    <tbody>

        {% for course in courses %}

        <tr>

            <td>{{ course.course_name }}</td>

            <td>{{ course.credits }}</td>

            <td>{{ course.teacher.full_name }}</td>

            <td>

                <a
                href="/edit_course/{{ course.id }}"
                class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a
                href="/delete_course/{{ course.id }}"
                class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

<a href="/add_course" class="btn btn-success mb-3">
    Add Course
</a>
    <a href="/import_courses" class="btn btn-success mb-3">
        Import Courses Excel
    </a>
</div>

</body>

</html>
