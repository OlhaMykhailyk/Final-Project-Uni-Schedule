<!DOCTYPE html>
<html>
<head>
    <title>Edit Classroom</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>Edit Classroom</h1>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">
                Room Number
            </label>

            <input
                type="text"
                name="room_number"
                class="form-control"
                value="{{ classroom.room_number }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                Capacity
            </label>

            <input
                type="number"
                name="capacity"
                class="form-control"
                value="{{ classroom.capacity }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-success">
            Save Changes
        </button>

        <a href="/classrooms" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
