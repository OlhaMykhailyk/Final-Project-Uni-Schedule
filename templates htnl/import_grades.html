<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Import Grades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">
                <h3>Import Grades from Excel</h3>
            </div>

            <div class="card-body">

                <form
                    method="POST"
                    enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Select Excel File
                        </label>

                        <input
                            type="file"
                            name="excel_file"
                            class="form-control"
                            accept=".xlsx,.xls"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Import Grades
                    </button>

                    <a
                        href="/grades"
                        class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
