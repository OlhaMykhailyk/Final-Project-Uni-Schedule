<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Grades</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1 class="mb-4">
    Grades Page
</h1>

<a href="/" class="btn btn-secondary mb-3">
    Back Home
</a>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Grade</th>
            <th>Actions</th>
        </tr>

    </thead>

    <tbody>

        {% for grade in grades %}

        <tr>

            <td>{{ grade.student.full_name }}</td>

            <td>{{ grade.course.course_name }}</td>

            <td>{{ grade.value }}</td>

            <td>

                <a
                href="/edit_grade/{{ grade.id }}"
                class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a
                href="/delete_grade/{{ grade.id }}"
                class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

<a href="/add_grade"
   class="btn btn-success">
    Add Grade
</a>
    <a href="/import_grades" class="btn btn-success mb-3">
        Import Grades Excel
    </a>
</div>

</body>

</html>
