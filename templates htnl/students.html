<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Students</title>

</head>

<body>

            <tr>

        </thead>

        <tbody>

                <td>{{ student.full_name }}</td>

                <td>{{ student.group_name }}</td>

                <td>

<a
href="/edit_student/{{ student.id }}"
class="btn btn-warning btn-sm">

    Edit

</a>

<a
href="/delete_student/{{ student.id }}"
class="btn btn-danger btn-sm">

    Delete

</a>

</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

<a href="/add_student" class="btn btn-success mb-3">
    Add Student
</a>
    <a href="/import_students" class="btn btn-success mb-3">
        Import Students Excel
    </a>
</div>

</body>

</html>
