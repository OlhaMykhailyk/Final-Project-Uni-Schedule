<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">
                <h3>Edit Schedule Entry</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Course
                        </label>

                        <select
                            name="course_id"
                            class="form-select">

                            {% for course in courses %}

                            <option
                                value="{{ course.id }}"
                                {% if course.id == lesson.course_id %}
                                selected
                                {% endif %}>

                                {{ course.course_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Classroom
                        </label>

                        <select
                            name="classroom_id"
                            class="form-select">

                            {% for classroom in classrooms %}

                            <option
                                value="{{ classroom.id }}"
                                {% if classroom.id == lesson.classroom_id %}
                                selected
                                {% endif %}>

                                Room {{ classroom.room_number }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            name="lesson_date"
                            class="form-control"
                            value="{{ lesson.lesson_date }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Time
                        </label>

                        <input
                            type="time"
                            name="lesson_time"
                            class="form-control"
                            value="{{ lesson.lesson_time }}"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="/schedule"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
