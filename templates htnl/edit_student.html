<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>Edit Student</h1>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                class="form-control"
                value="{{ student.full_name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                Group
            </label>

            <input
                type="text"
                name="group_name"
                class="form-control"
                value="{{ student.group_name }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-success">
            Save Changes
        </button>

        <a href="/students" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
