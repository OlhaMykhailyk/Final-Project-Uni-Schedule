<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>
<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">
                <h3>Add Course</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Course Name
                        </label>

                        <input
                            type="text"
                            name="course_name"
                            class="form-control"
                            placeholder="Enter course name"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Credits
                        </label>

                        <input
                            type="number"
                            name="credits"
                            class="form-control"
                            placeholder="Enter credits"
                            min="1"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Teacher
                        </label>

                        <select
                            name="teacher_id"
                            class="form-select">

                            {% for teacher in teachers %}

                            <option value="{{ teacher.id }}">
                                {{ teacher.full_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Add Course
                    </button>

                    <a
                        href="/courses"
                        class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
